<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Desk</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e0db;
  --ink:#1c1c1a; --ink-2:#4a4945; --muted:#7a7872;
  --accent:#2a78d6; --accent-ink:#1f5fae; --bar:#2a78d6;
  --good:#0ca30c; --good-ink:#006300; --warn:#b07a00; --bad:#d03b3b;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;
  --serif:"Iowan Old Style","Songti SC","Noto Serif CJK SC",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f;
    --ink:#ecebe7; --ink-2:#c2c0ba; --muted:#8d8b85; --accent:#3987e5; --accent-ink:#7db3f2; --bar:#3987e5;
    --good-ink:#0ca30c; --warn:#fab219; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent-ink);text-decoration:none} a:hover{text-decoration:underline}
header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px}
h1.brand{font:600 20px/1 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
main{padding:0 24px 40px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font:600 22px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .h{color:var(--ink-2);font-size:12px;margin-top:2px}
.setup{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.setup h3{margin:0 0 6px;font-size:13px}
.setup li{margin:2px 0;color:var(--ink-2)}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font:500 13px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.panel{display:none} .panel.on{display:block}
/* reports */
.reports{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;min-height:70vh}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 120px);position:sticky;top:12px}
.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.filters input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.items{overflow:auto;flex:1}
.day{padding:8px 12px 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink)}
.item:hover{background:var(--surface-2)} .item.sel{background:var(--surface-2);border-left-color:var(--accent)}
.item .t{font-weight:500;font-size:13px}
.item .s{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-right:4px}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px clamp(16px,4vw,48px);min-width:0}
.reader .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
.md{font:15.5px/1.7 var(--serif);max-width:780px;overflow-wrap:anywhere}
.md h1{font:600 24px/1.3 var(--sans);margin:12px 0 10px}
.md h2{font:600 17px/1.35 var(--sans);margin:26px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
.md h3{font:600 15px/1.4 var(--sans);margin:18px 0 6px}
.md table{border-collapse:collapse;font:13px/1.45 var(--sans);margin:10px 0;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.md th{color:var(--muted);font-weight:500}
.md td.num{text-align:right;font-variant-numeric:tabular-nums}
.md td .up{color:var(--good-ink)} .md td .down{color:var(--bad)}
.md code{font:12.5px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--surface-2);padding:12px;border-radius:8px;overflow:auto} .md pre code{background:none;padding:0}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.empty{color:var(--muted);padding:40px 12px;text-align:center}
.back{display:none}
/* tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;overflow-x:auto}
.card h2{font:600 14px var(--sans);margin:0 0 10px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.t th.n{text-align:right}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.err{color:var(--bad);font-size:12px;max-width:520px}
.muted{color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .08s}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langsw button{border:0;background:none;padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.langsw button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.cn-colors .md td .up{color:var(--bad)} .cn-colors .md td .down{color:var(--good-ink)}
:lang(zh) .md{font-family:"PingFang SC","Songti SC","Noto Serif CJK SC",var(--serif);line-height:1.85}
.embed header,.embed #setup{display:none}
.embed main{padding-top:12px;max-width:none}
.embed .list{max-height:calc(100vh - 230px)}
.wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
@media (max-width:820px){
  header,main{padding-left:16px;padding-right:16px}
  .pills{margin-left:0}
  .reports{grid-template-columns:1fr}
  .list{position:static;max-height:none}
  .reports.reading .list{display:none} .reports:not(.reading) .reader{display:none}
  .back{display:inline-block;margin-bottom:8px;background:none;border:0;color:var(--accent-ink);font:500 13px var(--sans);padding:0;cursor:pointer}
}
</style>
</head>
<body>
<header>
  <h1 class="brand" id="brand">Market Desk</h1>
  <span class="sub" id="stamp">loading…</span>
  <div class="pills"><span id="pills" class="pills" style="margin:0"></span><span class="langsw" id="langsw"><button data-ui="en">EN</button><button data-ui="zh">中文</button></span></div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section id="setup"></section>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="reports" aria-selected="true" data-t="tab_reports">Reports</button>
    <button role="tab" data-tab="schedules" aria-selected="false" data-t="tab_schedules">Schedules</button>
    <button role="tab" data-tab="calls" aria-selected="false" data-t="tab_calls">Calls</button>
    <button role="tab" data-tab="usage" aria-selected="false" data-t="tab_usage">Usage</button>
    <button role="tab" data-tab="watchlist" aria-selected="false" data-t="tab_watchlist">Watchlist</button>
  </nav>

  <section class="panel on" id="p-reports">
    <div class="reports" id="reportsWrap">
      <div class="list">
        <div class="filters">
          <input id="q" type="search" placeholder="Search titles, summaries, tickers…" data-tp="search" autocomplete="off">
          <div class="chips" id="typeChips"></div>
          <div class="chips" id="originChips"></div>
          <div class="chips" id="langChips"></div>
        </div>
        <div class="items" id="items"></div>
      </div>
      <article class="reader" id="reader"><div class="empty" data-t="pick">Pick a report on the left.</div></article>
    </div>
  </section>
  <section class="panel" id="p-schedules"></section>
  <section class="panel" id="p-calls"></section>
  <section class="panel" id="p-usage"></section>
  <section class="panel" id="p-watchlist"></section>
</main>

<script>
/* ---------- i18n ---------- */
const I18N = {
  en: {
    brand:"Market Desk", updated:"updated", loading:"loading…", error:"error",

    h_calib:"Calibration", h_calls:"All calls", c_stated_conf:"Stated confidence", c_calls:"Calls", c_stated:"Stated", c_realized:"Realized", c_gap:"Gap", pts:"pts",
    gap_note:"Negative gap = overconfident in that bucket. Small samples are noisy; read this after 20+ resolved calls.",
    resolved:"resolved", hit:"hit rate", coin:"coin-flip 0.250", noresolved:"No resolved calls yet. The weekly review resolves and scores them.",
    c_id:"ID", c_made:"Made", c_asset:"Asset", c_call:"Call", c_prob:"Prob", c_resolves:"Resolves", c_outcome:"Outcome", c_note:"Note", c_lang:"Lang",
    yes:"✓ true", no:"✗ false", noledger:"The ledger is empty. Briefs log calls to <code>market-desk/library/calls.csv</code>.",
    h_tokens:"Tokens per day · last 30 days", tok_sum:(t,r,f)=>`${t} tokens, ${r} runs, ${f} failed (! marks days with failures)`,
    h_models:"By model", h_fail:"Recent failures", c_model:"Model", c_in:"Input", c_out:"Output", c_total:"Total tokens", c_day:"Day", c_failed:"Failed",
    noruns30:"No runs recorded yet.", nofail:"No failed runs in the last 30 days.", tableview:"Table view", tokens:"tokens",
    wl_edit:p=>`Edit <code>${p}</code>; the briefs read it on every run.`, wl_none:p=>`No watchlist at ${p}.`,

    status:{}, in:t=>"in "+t, ago:t=>t+" ago",
  },
  zh: {
    brand:"投研台", updated:"更新于", loading:"加载中…", error:"出错",
    tab_reports:"报告", tab_schedules:"定时任务", tab_calls:"预测记录", tab_usage:"用量", tab_watchlist:"自选",
    pick:"在左侧选择一份报告。", search:"搜索标题、摘要、代码…",
    df_up:"DeerFlow 运行中", df_down:"DeerFlow 未运行", sched_on:"调度已开启", sched_off:"调度未开启",
    lib_on:"研究库已挂载", lib_off:"研究库未挂载", no_model:"未配置模型", open_df:"打开 DeerFlow ↗", mode:"工作模式",

    k_reports:"近 7 日报告", total:"累计", k_sched:"启用中的定时任务", next:"下次", none_queued:"暂无排程",

    h_tasks:"定时任务", h_runs:"最近运行", c_task:"任务", c_agent:"智能体", c_schedule:"时间表", c_status:"状态", c_next:"下次运行", c_last:"上次运行",
    c_runs:"次数", c_lasterr:"最近错误", c_when:"计划时间", c_trigger:"触发方式", c_dur:"耗时", c_tokens:"Token", c_thread:"对话", c_error:"错误",

    c_id:"编号", c_made:"提出日", c_asset:"标的", c_call:"预测", c_prob:"概率", c_resolves:"验证日", c_outcome:"结果", c_note:"备注", c_lang:"语言",

    wl_edit:p=>`编辑 <code>${p}</code>，每次简报都会读取。`, wl_none:p=>`找不到自选列表：${p}`,
    sections:{a_shares:"A 股", hong_kong:"港股", indices:"指数", macro:"宏观", crypto:"加密资产"},
    status:{success:"成功", active:"启用", enabled:"启用", resolved:"已验证", running:"运行中", queued:"排队中", launching:"启动中", open:"待验证", paused:"已暂停", skipped:"已跳过", void:"作废", failed:"失败", error:"错误", timeout:"超时", schedule:"定时", manual:"手动"},

const params = new URLSearchParams(location.search);
const BASE = location.pathname.startsWith("/desk") ? "/desk" : "";
const EMBED = params.get("embed") === "1";
if (EMBED) document.documentElement.classList.add("embed");
let UI = params.get("lang") || (EMBED ? "zh" : null) || (location.pathname.startsWith("/zh") ? "zh" : location.pathname.startsWith("/en") ? "en" : null);
try { UI = UI || localStorage.getItem("md-ui"); } catch(_){}
let UI_FROM_SETTINGS = !UI;
const T = (k, ...a) => { const v = (I18N[UI||"en"][k] ?? I18N.en[k]); return typeof v === "function" ? v(...a) : v; };
const TY = t => (I18N[UI||"en"].types[t] || t);
function applyStatic(){
  document.documentElement.lang = UI === "zh" ? "zh-CN" : "en";
  document.body.classList.toggle("cn-colors", UI === "zh");   // 红涨绿跌 in Mandarin view
  document.title = T("brand");
  $("#brand").textContent = T("brand");
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = T(e.dataset.tp));
  document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.ui === UI));
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const LOC = () => UI === "zh" ? "zh-CN" : undefined;
const fmtN = n => n == null ? "–" : Number(n).toLocaleString(LOC());
const fmtTok = n => n == null ? "–" : UI === "zh" && n >= 1e4 ? (n/1e4).toFixed(n>=1e5?0:1)+"万" : n >= 1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
const local = iso => { if(!iso) return "–"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(LOC(), {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}); };
const rel = iso => { if(!iso) return ""; const s=(new Date(iso)-Date.now())/1000, a=Math.abs(s);
  const zh = UI === "zh";
  const t = a<3600? Math.round(a/60)+(zh?" 分钟":"m") : a<86400? Math.round(a/3600)+(zh?" 小时":"h") : Math.round(a/86400)+(zh?" 天":"d");
  return s>0? T("in", t) : T("ago", t); };
const STATUS = {success:"ok", active:"ok", enabled:"ok", resolved:"ok", running:"warn", queued:"warn", launching:"warn", open:"warn", paused:"", skipped:"", void:"", failed:"bad", error:"bad", timeout:"bad"};

const fmtDur = d => d==null ? "–" : UI==="zh" ? (d>=60 ? `${Math.floor(d/60)} 分 ${d%60} 秒` : `${d} 秒`) : (d>=60 ? `${Math.floor(d/60)}m ${d%60}s` : `${d}s`);

/* ---------- tiny markdown renderer (headings, lists, tables, quotes, code, inline) ---------- */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function cell(c){
  const t = c.trim(), h = inline(t);
  if (/^[+\-−]?\d[\d,.]*\s*%?$/.test(t) || /^[+\-]\d/.test(t)) {
    const cls = /^\+/.test(t) ? "up" : /^[-−]\d/.test(t) ? "down" : "";
    return `<td class="num">${cls?`<span class="${cls}">${h}</span>`:h}</td>`;
  }
  return `<td>${h}</td>`;
}
function md(src){
  const lines = src.replace(/\r/g,"").split("\n"); let out = [], i = 0;
  while (i < lines.length){
    let l = lines[i];
    if (/^```/.test(l)){ let buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    if (/^#{1,6}\s/.test(l)){ const n=l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n).trim())}</h${n}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const row = r => r.trim().replace(/^\||\|$/g,"").split("|");
      const head = row(l); i += 2; let body=[];
      while (i<lines.length && /^\s*\|/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><thead><tr>${head.map(h=>`<th>${inline(h.trim())}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table>`); continue;
    }
    if (/^>\s?/.test(l)){ let buf=[]; while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,"")); out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      const ordered = /^\s*\d/.test(l); let items=[];
      while (i<lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !/^\s{4,}/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,""));
        else items[items.length-1] += " " + lines[i].trim();
        i++;
      }
      const tag = ordered ? "ol" : "ul"; out.push(`<${tag}>${items.map(x=>`<li>${inline(x)}</li>`).join("")}</${tag}>`); continue;
    }
    if (!l.trim()){ i++; continue; }
    let buf=[l]; i++;
    while (i<lines.length && lines[i].trim() && !/^(#|```|>|\s*\||\s*([-*+]|\d+[.)])\s)/.test(lines[i])) buf.push(lines[i++]);
    const joiner = /[一-鿿]$/.test(buf[0]) ? "" : " ";
    out.push(`<p>${inline(buf.join(joiner))}</p>`);
  }
  return out.join("\n");
}

function renderChips(){

function visibleReports(){
  const q = FILTER.q.toLowerCase();

    && (FILTER.lang==="all" || !FILTER.lang || r.lang===FILTER.lang)
    && (!q || [r.title, r.summary, r.tickers.join(" "), r.thread_title, r.path].join(" ").toLowerCase().includes(q)));

      <div class="s"><span class="tag">${esc(TY(r.mode||r.type))}</span>${esc(r.summary || r.thread_title || r.path)}</div></button>`;

/* ---------- usage ---------- */
function barChart(days){
  const W = 900, H = 200, pad = {l:48, r:8, t:10, b:24}, n = days.length;
  const max = Math.max(1, ...days.map(d => d.tokens)); const step = (W-pad.l-pad.r)/n, bw = Math.max(2, step-2);
  const raw = max/4, pw = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/pw;
  const tick = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*pw, nt = Math.ceil(max/tick), nice = tick*nt;
  const y = v => pad.t + (H-pad.t-pad.b) * (1 - v/nice);
  let g = "";
  for (let i=0;i<=nt;i++){ const v = tick*i; g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtTok(v)}</text>`; }
  let bars = "";
  days.forEach((d,i) => { const x = pad.l + i*step + 1, top = y(d.tokens), h = Math.max(0, H-pad.b-top);
    if (h>0) bars += `<path d="M${x},${H-pad.b} V${top+Math.min(4,h)} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${H-pad.b} Z" fill="var(--bar)"/>`;
    if (d.failed) bars += `<text x="${x+bw/2}" y="${top-4}" text-anchor="middle" font-size="11" fill="var(--bad)">!</text>`;
    bars += `<rect class="hit" data-i="${i}" x="${pad.l+i*step}" y="${pad.t}" width="${step}" height="${H-pad.t-pad.b}" fill="transparent"/>`;
    if (i % Math.ceil(n/8) === 0) bars += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.day.slice(5)}</text>`; });
  return `<div class="chart" id="uchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("h_tokens"))}">${g}${bars}</svg><div class="tip" id="utip"></div></div>`;
}

  const chart = $("#uchart"), tip = $("#utip");
  chart.addEventListener("mousemove", e => { const r = e.target.closest(".hit"); if (!r){ tip.style.opacity = 0; return; }
    const x = d.days[+r.dataset.i], box = chart.getBoundingClientRect();

  if (!d.exists){ $("#p-watchlist").innerHTML = `<div class="empty">${T("wl_none", esc(d.path))}</div>`; return; }
  const secName = n => I18N[UI||"en"].sections[n] || n.replace(/_/g," ");
  $("#p-watchlist").innerHTML = `<p class="muted">${T("wl_edit", esc(d.path))}</p><div class="wl">${
    d.sections.map(s => `<div class="card"><h2>${esc(secName(s.name))}</h2><table class="t"><tbody>${
      s.items.map(i => `<tr><td><code>${esc(i.code)}</code></td><td>${esc(i.name)}</td><td class="muted">${esc(i.note)}</td></tr>`).join("")}</tbody></table></div>`).join("")}</div>`;
}

/* ---------- tabs, language switch, refresh ---------- */
const LOADERS = {reports: loadReports, schedules: loadSchedules, calls: loadCalls, usage: loadUsage, watchlist: loadWatchlist};
let TAB = "reports";
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return;
  TAB = b.dataset.tab; document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-"+TAB)); LOADERS[TAB]().catch(showErr);
  try { localStorage.setItem("md-tab", TAB); } catch(_){} });
$("#langsw").addEventListener("click", e => { const b = e.target.closest("button[data-ui]"); if (!b) return;
  UI = b.dataset.ui; UI_FROM_SETTINGS = false;
  if (DESK_MODE === "both") FILTER.lang = UI;
  try { localStorage.setItem("md-ui", UI); } catch(_){}
  const u = new URL(location.href); u.searchParams.set("lang", UI); history.replaceState(null, "", u);
  applyStatic(); SELECTED = null; refresh(); });
function showErr(e){ $("#stamp").textContent = T("error") + ": " + e.message; }
function refresh(){ loadOverview().then(() => LOADERS[TAB]()).catch(showErr); }
applyStatic();
if (EMBED) document.addEventListener("click", e => { const a = e.target.closest("a[href]"); if (!a) return;
  const u = new URL(a.href, location.href); if (u.pathname.startsWith("/workspace")) { e.preventDefault(); window.top.location.href = u.pathname + u.search; } });
try { const t = params.get("tab") || localStorage.getItem("md-tab"); if (t && LOADERS[t]) { TAB = t; document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab===t)); document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-"+t)); } } catch(_){}
refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 60000);
</script>
